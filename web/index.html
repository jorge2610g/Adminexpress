<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Adminexpress - Panel administrativo de Express Delivery">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#2563EB">
  <!-- Preview assets are versioned by the safe Preview-only Pages workflow. -->
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <title>Adminexpress</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Preview only; never changes Production files, sessions or data.
    // The Pages Preview-only workflow substitutes the build commit here.
    if (location.pathname.startsWith('/preview/')) {
      const buildSha = '__EXPRESS_PREVIEW_BUILD_SHA__';
      window.addEventListener('DOMContentLoaded', () => {
        const marker = document.createElement('div');
        marker.id = 'express-preview-ui-marker';
        marker.textContent = 'EXPRESS QA · ' + buildSha.slice(0, 8);
        marker.style.cssText = [
          'position:fixed', 'bottom:12px', 'right:12px',
          'z-index:2147483647', 'pointer-events:none',
          'background:#0F2854', 'color:#FFFFFF', 'font:700 11px Arial,sans-serif',
          'padding:7px 10px', 'border-radius:9px',
          'border:1px solid #22D3EE', 'box-shadow:0 4px 16px #0003',
        ].join(';');
        document.body.appendChild(marker);

        // An already-open Flutter tab keeps running the old JavaScript after
        // deployment. Give the administrator an explicit, non-disruptive
        // update button rather than silently reloading unsaved form edits.
        let announced = false;
        async function checkVersion() {
          if (announced || document.visibilityState === 'hidden') return;
          if (!/^[0-9a-f]{40}$/.test(buildSha)) return;
          try {
            const response = await fetch(
              '/preview/version.json?check=' + Date.now(),
              {cache: 'no-store', credentials: 'same-origin'},
            );
            if (!response.ok) return;
            const version = await response.json();
            const latest = version && version.commit;
            if (!/^[0-9a-f]{40}$/.test(latest) || latest === buildSha ||
                version.environment !== 'preview') return;
            announced = true;
            marker.textContent = '';
            marker.style.pointerEvents = 'auto';
            marker.style.display = 'flex';
            marker.style.alignItems = 'center';
            marker.style.gap = '10px';
            const description = document.createElement('span');
            description.textContent = 'Hay una nueva versión de Preview';
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = 'Recargar';
            button.style.cssText = [
              'border:1px solid #67E8F9','border-radius:6px',
              'color:#0F2854','background:#CFFAFE','cursor:pointer',
              'padding:6px 10px','font:700 11px Arial,sans-serif',
            ].join(';');
            button.addEventListener('click', () => {
              const url = new URL('/preview/', location.origin);
              url.searchParams.set('build', latest);
              location.assign(url.toString());
            });
            marker.append(description, button);
          } catch (_) {
            // Network unavailable: keep the existing session running.
          }
        }
        document.addEventListener('visibilitychange', checkVersion);
        window.setInterval(checkVersion, 180000);
        checkVersion();
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
