<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ficha del usuario</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>body{margin:0;font-family:'Plus Jakarta Sans',sans-serif}button,input{font-family:inherit}</style>
</helmet>
<div style="width:900px;height:1000px;box-sizing:border-box;padding:28px 40px;background:linear-gradient(rgba(15,23,42,.06),rgba(15,23,42,.06)),#E9EEF5;color:#0F172A;font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden">
<div style="width:820px;box-sizing:border-box;background:#FFFFFF;border-radius:16px;box-shadow:0 24px 60px rgba(15,23,42,.18);display:flex;flex-direction:column">
<div style="padding:20px 24px 14px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid #EEF1F5">
<div style="width:42px;height:42px;border-radius:21px;background:#EAF2FF;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#2563EB">MV</div>
<div style="flex:1"><div style="font-size:20px;font-weight:800;letter-spacing:-.3px">Ficha del usuario</div><div style="font-size:12px;font-weight:600;color:#64748B;margin-top:2px">maria.vaca@hotmail.com</div></div>
<span style="display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#E8F8EF;font-size:11px;font-weight:800;color:#14804A"><span style="width:6px;height:6px;border-radius:3px;background:#14804A"></span>Activa</span>
</div>
<div style="padding:16px 24px;display:flex;flex-direction:column;gap:12px">
<div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:14px;padding:14px">
<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/></svg><span style="font-size:13px;font-weight:800">Perfil y cuenta</span></div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="6">
<div style="display:flex;flex-direction:column;gap:5px">
<span style="font-size:11px;font-weight:700;color:#64748B">{{f.l}}</span>
<sc-if value="{{f.tx}}" hint-placeholder-val="{{ true }}"><input value="{{f.v}}" style="width:100%;height:38px;box-sizing:border-box;border:1px solid #D0D5DD;border-radius:10px;padding:0 12px;font-size:13px;font-weight:600;color:{{f.ink}};background:{{f.bg}}" /></sc-if>
<sc-if value="{{f.dd}}" hint-placeholder-val="{{ false }}"><div style="height:38px;box-sizing:border-box;border:1px solid #D0D5DD;border-radius:10px;background:#FFFFFF;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:13px;font-weight:600;color:#0F172A"><span>{{f.v}}</span><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></div></sc-if>
</div>
</sc-for>
</div>
</div>
<div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:14px;padding:14px">
<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg><span style="font-size:13px;font-weight:800">Resumen</span></div>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 18px">
<sc-for list="{{summary}}" as="s" hint-placeholder-count="4">
<div><div style="font-size:10.5px;font-weight:700;color:#64748B">{{s.l}}</div><div style="font-size:13px;font-weight:700;margin-top:2px">{{s.v}}</div></div>
</sc-for>
</div>
</div>
<div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:14px;padding:14px">
<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16l1.5-5h11L19 16M5 16v3M19 16v3M4 16h16M8 13h.01M16 13h.01"/></svg><span style="font-size:13px;font-weight:800">Viajes recientes</span></div>
<sc-for list="{{trips}}" as="t" hint-placeholder-count="7">
<div style="display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid #EEF1F5">
<div style="width:34px;height:34px;border-radius:10px;background:#EAF2FF;display:flex;align-items:center;justify-content:center;flex:none"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19a2 2 0 100-4 2 2 0 000 4zM19 9a2 2 0 100-4 2 2 0 000 4zM7 17h8a3 3 0 000-6H9a3 3 0 010-6h6"/></svg></div>
<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:800">{{t.r}}</div><div style="font-size:11.5px;font-weight:600;color:#64748B;margin-top:2px">{{t.s}} · {{t.f}} · {{t.d}}</div></div>
</div>
</sc-for>
</div>
</div>
<div style="padding:12px 24px 18px;border-top:1px solid #EEF1F5;display:flex;justify-content:flex-end;gap:10px">
<button style="height:40px;padding:0 14px;border-radius:10px;border:0;background:transparent;color:#2563EB;font-size:13px;font-weight:800">Cerrar</button>
<button style="height:40px;padding:0 16px;border-radius:10px;border:0;background:#2563EB;color:#FFFFFF;font-size:13px;font-weight:800;display:flex;align-items:center;gap:7px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5zM8 3v5h7V3M8 21v-7h8v7"/></svg>Guardar cambios</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const T = (l, v) => ({ l, v, tx: true, dd: false, bg: '#FFFFFF', ink: '#0F172A' });
const R = (l, v) => ({ l, v, tx: true, dd: false, bg: '#F2F4F7', ink: '#98A2B3' });
const D = (l, v) => ({ l, v, tx: false, dd: true });
return {
fields: [T('Nombre completo', 'María Vaca Suárez'), T('Teléfono', '+591 76543210'), R('Correo (solo lectura)', 'maria.vaca@hotmail.com'), D('Modo activo', 'Pasajero'), D('Estado', 'Activa'), D('Zona', 'Trinidad')],
summary: [{ l: 'Billetera', v: 'BOB 45.50' }, { l: 'Calificación', v: '4.9 / 5 · 38 evaluaciones' }, { l: 'QA / pruebas', v: 'Cuenta real' }, { l: 'Alta', v: '21/06/2025 · 18:37' }],
trips: [
{ r: 'Plaza principal → Terminal de buses', s: 'Completado', f: '15.00', d: '10/10/2026 · 08:42' },
{ r: 'Barrio Fátima → Hospital Materno Infantil', s: 'Completado', f: '12.00', d: '09/10/2026 · 19:15' },
{ r: 'Mercado Pompeya → Av. 6 de Agosto', s: 'Cancelado', f: '10.00', d: '08/10/2026 · 13:02' },
{ r: 'Universidad Autónoma del Beni → Centro', s: 'Completado', f: '14.00', d: '07/10/2026 · 17:50' },
{ r: 'Centro → Aeropuerto Tte. Jorge Henrich', s: 'Completado', f: '25.00', d: '05/10/2026 · 06:10' },
{ r: 'Barrio San Antonio → Plaza principal', s: 'Completado', f: '11.00', d: '03/10/2026 · 21:24' },
{ r: 'Terminal de buses → Barrio Pompeya', s: 'Completado', f: '13.00', d: '01/10/2026 · 10:05' }
]
};
}
}
</script>
</body>
</html>
