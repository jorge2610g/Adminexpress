<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Delivery</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>body{margin:0;font-family:'Plus Jakarta Sans',sans-serif}button,input{font-family:inherit}</style>
</helmet>
<div style="width:1280px;height:1160px;display:flex;background:#F1F5F9;color:#0F172A;font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden">
<dc-import name="Sidebar" active="Delivery" hint-size="248px,1160px"></dc-import>
<div style="flex:1;min-width:0;display:flex;flex-direction:column">
<dc-import name="Topbar" title="Delivery" env="preview" scope="admin" hint-size="1032px,168px"></dc-import>
<main style="flex:1;min-height:0;padding:22px 24px;display:flex;flex-direction:column;gap:16px">
<div style="border-radius:20px;padding:20px 24px;background:linear-gradient(120deg,#0F2854,#174B91 55%,#0D6B8D);color:#FFFFFF;display:flex;align-items:center;gap:16px;box-shadow:0 10px 30px rgba(23,75,145,.25)">
<div style="width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></div>
<div style="flex:1"><div style="font-size:24px;font-weight:800;letter-spacing:-.4px">Delivery</div><div style="font-size:13px;color:#D7E7FA;font-weight:600;margin-top:4px">Pedidos y entregas de Express.</div></div>
</div>
<div style="background:#FFFFFF;border:1px solid #E7ECF3;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
<sc-for list="{{periods}}" as="p" hint-placeholder-count="3">
<button style="height:34px;padding:0 13px;border-radius:999px;border:1px solid {{p.line}};background:{{p.bg}};color:{{p.ink}};font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px"><svg aria-hidden="true" width="{{p.check}}" height="14" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>{{p.label}}</button>
</sc-for>
<button style="height:34px;padding:0 13px;border-radius:10px;border:1px solid #BFD3F9;background:#FFFFFF;color:#2563EB;font-size:12px;font-weight:800;display:flex;align-items:center;gap:7px"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v16H3zM3 10h18M8 3v4M16 3v4"/></svg>1/10/2026 – 10/10/2026</button>
<span style="width:1px;height:24px;background:#E4E7EC;margin:0 4px"></span>
<label style="height:36px;width:240px;box-sizing:border-box;border:1px solid #D0D5DD;border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 11px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round"><path d="M11 18a7 7 0 100-14 7 7 0 000 14zM20 20l-3.5-3.5"/></svg><input type="text" placeholder="Buscar" style="border:0;outline:0;flex:1;min-width:0;font-size:13px;color:#0F172A;background:transparent"></label>
<span style="flex:1"></span>
<button style="height:36px;padding:0 14px;border-radius:10px;border:1px solid #D0D5DD;background:#FFFFFF;color:#0F172A;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:7px"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg>Exportar</button>
</div>
<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid #F1F5F9;padding-top:10px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button style="height:32px;padding:0 12px;border-radius:999px;border:1px solid {{c.line}};background:{{c.bg}};color:{{c.ink}};font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:3px;background:{{c.dot}}"></span>{{c.label}}</button>
</sc-for>
</div>
</div>
<div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<div style="background:#FFFFFF;border:1px solid {{r.line}};border-radius:12px;flex:none">
<div style="display:flex;align-items:center;gap:12px;padding:11px 14px">
<div style="width:36px;height:36px;flex:none;border-radius:10px;background:#EAF2FF;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6h13v10H1zM14 10h4l3 3v3h-7M5 19a2 2 0 100-4 2 2 0 000 4zM17 19a2 2 0 100-4 2 2 0 000 4z"/></svg></div>
<div style="flex:1;min-width:0">
<div style="font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.title}}</div>
<div style="display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:#64748B;font-weight:600">
<span style="display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;background:{{r.sbg}};color:{{r.sfg}};font-size:11px;font-weight:800"><span style="width:6px;height:6px;border-radius:3px;background:{{r.sfg}}"></span>{{r.status}}</span>
<span>{{r.pkg}}</span><span style="color:#CBD5E1">·</span><span style="font-weight:800;color:#0F172A">{{r.fare}}</span>
</div>
</div>
<span style="font-size:12px;color:#98A2B3;font-weight:700">{{r.time}}</span>
<button aria-label="{{r.toggle}}" style="width:34px;height:34px;border-radius:9px;border:0;background:{{r.btnBg}};display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{r.btnInk}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.chev}}"/></svg></button>
</div>
<sc-if value="{{r.open}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-wrap:wrap;gap:8px 28px;padding:12px 14px 14px 62px;border-top:1px solid #EEF1F5;background:#F8FAFC;border-radius:0 0 12px 12px">
<sc-for list="{{r.details}}" as="d" hint-placeholder-count="4">
<span style="font-size:12.5px;color:#64748B;font-weight:600">{{d.k}}: <span style="color:#0F172A;font-weight:800">{{d.v}}</span></span>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1160}}'>
class Component extends DCLogic {
renderVals() {
const ST = {
accepted: ['Aceptado', '#7C3AED', '#EDE5FF'],
cancelled: ['Cancelado', '#D92D20', '#FFE4E8'],
delivered: ['Entregado', '#14804A', '#E8F8EF'],
picked_up: ['Recogido', '#2563EB', '#EAF2FF'],
pending: ['Pendiente', '#B54708', '#FFF7E6']
};
const row = (from, to, st, pkg, fare, time, open, cli, rep, pay) => ({
title: from + ' → ' + to, status: ST[st][0], sfg: ST[st][1], sbg: ST[st][2], pkg, fare, time: '10/10 · ' + time,
open, line: open ? '#BFD3F9' : '#E7ECF3', chev: open ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6', toggle: open ? 'Contraer' : 'Expandir',
btnBg: open ? '#EAF2FF' : '#F8FAFC', btnInk: open ? '#2563EB' : '#64748B',
details: [{ k: 'Cliente', v: cli }, { k: 'Repartidor', v: rep }, { k: 'Pago', v: pay }, { k: 'Creado', v: '10/10/2026 · ' + time }]
});
const sel = (label) => ({ label, check: 0, bg: '#FFFFFF', line: '#E4E7EC', ink: '#0F172A' });
return {
periods: [sel('Hoy'), sel('Semana'), sel('Mes')],
chips: [
{ label: 'Todos (64)', dot: '#2563EB', bg: '#EAF2FF', line: '#BFD3F9', ink: '#2563EB' },
{ label: 'Aceptado', dot: '#7C3AED', bg: '#FFFFFF', line: '#E4E7EC', ink: '#0F172A' },
{ label: 'Cancelado', dot: '#D92D20', bg: '#FFFFFF', line: '#E4E7EC', ink: '#0F172A' },
{ label: 'Entregado', dot: '#14804A', bg: '#FFFFFF', line: '#E4E7EC', ink: '#0F172A' },
{ label: 'Pendiente', dot: '#B54708', bg: '#FFFFFF', line: '#E4E7EC', ink: '#0F172A' },
{ label: 'Recogido', dot: '#2563EB', bg: '#FFFFFF', line: '#E4E7EC', ink: '#0F172A' }
],
rows: [
row('Farmacia Central', 'Calle Nicolás Suárez 418', 'picked_up', 'Medicamentos', 'Bs 12.00', '10:51', true, 'Claudia Rivera', 'Fernando Justiniano', 'Efectivo'),
row('Restaurante Mojos', 'Av. 6 de Agosto 1020', 'accepted', 'Comida', 'Bs 15.00', '10:22', false, 'Pedro Arteaga', 'Luis Rivero', 'Efectivo'),
row('Supermercado Fidalga', 'Barrio San Vicente', 'pending', 'Paquete', 'Bs 18.00', '10:14', false, 'Rosa Mamani', '—', 'Transferencia'),
row('Librería Don Bosco', 'Colegio Nacional Ganadero', 'delivered', 'Documentos', 'Bs 8.00', '09:56', false, 'Javier Lijerón', 'Wilson Añez', 'Efectivo'),
row('Pollos Kiki', 'Barrio Pompeya, calle 3', 'delivered', 'Comida', 'Bs 10.00', '09:41', false, 'Mónica Rojas', 'Luis Rivero', 'Efectivo'),
row('Ferretería El Constructor', 'Barrio Nueva Trinidad', 'cancelled', 'Paquete', 'Bs 20.00', '09:30', false, 'Erwin Pinto', '—', 'Efectivo'),
row('Panadería La Trinitaria', 'Av. Bolívar y La Paz', 'delivered', 'Comida', 'Bs 7.00', '09:12', false, 'Silvia Durán', 'Fernando Justiniano', 'Efectivo'),
row('Oficina Tigo Centro', 'Universidad Autónoma del Beni', 'delivered', 'Documentos', 'Bs 9.00', '08:58', false, 'Marcelo Tórrez', 'Wilson Añez', 'Transferencia'),
row('Heladería Frutos del Beni', 'Plaza principal José Ballivián', 'delivered', 'Comida', 'Bs 8.00', '08:40', false, 'Lorena Gil', 'Ronald Parada', 'Efectivo'),
row('Mercado Campesino', 'Barrio Fátima', 'delivered', 'Paquete', 'Bs 14.00', '08:22', false, 'Gonzalo Áñez', 'Luis Rivero', 'Efectivo')
]
};
}
}
</script>
</body>
</html>
