<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span style="font-size:16px;font-weight:800">{{c.t}}</span><span style="font-size:12px;color:#64748B;font-weight:600;line-height:1.45">{{c.s}}</span></span>
<span style="display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:none"><span style="font-size:12.5px;font-weight:800;color:#2563EB;white-space:nowrap">{{c.n}}</span><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg></span>
</button>
</sc-for>
</div>
<div style="background:#FFFFFF;border:1px solid #DDE6F0;border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:center">

<div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:800">Pedidos fuera de esta pantalla</div><div style="font-size:12.5px;color:#64748B;font-weight:600;margin-top:2px">Los pedidos ahora tienen acceso propio debajo de Delivery en el menú lateral.</div></div>
<span style="display:flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;background:#E8F8EF;color:#14804A;font-size:11.5px;font-weight:800"><span style="width:6px;height:6px;border-radius:3px;background:#14804A"></span>12 recientes</span>
