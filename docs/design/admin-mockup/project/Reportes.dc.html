<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reportes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>body{margin:0;font-family:'Plus Jakarta Sans',sans-serif}button,input{font-family:inherit}</style>
</helmet>
<div style="width:1280px;height:1160px;display:flex;background:#F1F5F9;color:#0F172A;font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden">
<dc-import name="Sidebar" active="Reportes" hint-size="248px,1160px"></dc-import>
<div style="flex:1;min-width:0;display:flex;flex-direction:column">
<dc-import name="Topbar" title="Reportes" env="preview" scope="none" hint-size="1032px,112px"></dc-import>
<main style="flex:1;min-height:0;padding:22px 24px;display:flex;flex-direction:column;gap:16px">
<div>
<div style="font-size:26px;font-weight:800;letter-spacing:-.3px">Reportes</div>
<div style="font-size:13px;color:#64748B;font-weight:600;margin-top:4px">Resumen general de Express. Una sola pantalla, sin cambiar el modo del panel ni seleccionar país o zona.</div>
</div>
<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#FFFFFF;border:1px solid #DDE6F0;border-radius:16px;padding:12px 14px">
<button style="height:40px;padding:0 14px;border-radius:10px;border:1px solid #D0D5DD;background:#FFFFFF;color:#0F172A;font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v16H3zM3 10h18M8 3v4M16 3v4"/></svg>Desde 10/09/2026<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
<button style="height:40px;padding:0 14px;border-radius:10px;border:1px solid #D0D5DD;background:#FFFFFF;color:#0F172A;font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v16H3zM3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>Hasta 10/10/2026<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
<button style="height:40px;padding:0 14px;border-radius:10px;border:1px solid #D0D5DD;background:#FFFFFF;color:#0F172A;font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/></svg>Actualizar</button>
</div>
<div style="display:flex;align-items:center;gap:14px;background:#FFF7E6;border:1px solid #F5D58A;border-radius:14px;padding:14px 16px">
<div style="width:42px;height:42px;border-radius:12px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#B54708" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6L4 19a1.5 1.5 0 001.3 2h13.4a1.5 1.5 0 001.3-2L14 9V3"/></svg></div>
<div style="flex:1"><div style="font-size:15px;font-weight:800;color:#B54708">Actividad de pruebas internas</div><div style="font-size:12.5px;color:#7A2E0E;font-weight:600;margin-top:2px">Datos QA separados: no se suman a los resultados reales.</div></div>
<span style="display:flex;align-items:center;gap:6px;background:#FFFFFF;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;color:#B54708"><span style="width:6px;height:6px;border-radius:3px;background:#B54708"></span>Preview</span>
</div>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px">
<sc-for list="{{metrics}}" as="m" hint-placeholder-count="9">
<div style="background:#FFFFFF;border:1px solid #DDE6F0;border-radius:16px;padding:18px;min-height:112px;box-sizing:border-box;display:flex;align-items:center;gap:14px">
<div style="width:46px;height:46px;border-radius:23px;background:#EAF2FF;display:flex;align-items:center;justify-content:center;flex:none"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{m.d}}"/></svg></div>
<div style="min-width:0"><div style="font-size:22px;font-weight:800;letter-spacing:-.4px;white-space:nowrap">{{m.value}}</div><div style="font-size:12.5px;color:#64748B;font-weight:700;margin-top:2px">{{m.label}}</div></div>
</div>
</sc-for>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1160}}'>
class Component extends DCLogic {
renderVals() {
const I = {
taxi: 'M5 16l1.5-5h11L19 16M5 16v3M19 16v3M4 16h16M8 13h.01M16 13h.01',
done: 'M12 21a9 9 0 100-18 9 9 0 000 18zM8 12l3 3 5-6',
cancel: 'M12 21a9 9 0 100-18 9 9 0 000 18zM9 9l6 6M15 9l-6 6',
truck: 'M1 6h13v10H1zM14 10h4l3 3v3h-7M5 19a2 2 0 100-4 2 2 0 000 4zM17 19a2 2 0 100-4 2 2 0 000 4z',
box: 'M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',
cart: 'M3 4h2l2.4 11h11L21 7H6.2M9 20h.01M18 20h.01M4 4l16 16',
pay: 'M2 6h20v12H2zM2 10h20M6 15h4',
user: 'M15 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M8.5 11a4 4 0 100-8 4 4 0 000 8zM20 8v6M23 11h-6',
sos: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM12 8v5M12 16h.01'
};
return {
metrics: [
{ label: 'Viajes', value: '86', d: I.taxi },
{ label: 'Completados', value: '71', d: I.done },
{ label: 'Cancelados', value: '9', d: I.cancel },
{ label: 'Delivery', value: '24', d: I.truck },
{ label: 'Delivery completados', value: '20', d: I.box },
{ label: 'Delivery cancelados', value: '2', d: I.cart },
{ label: 'Cobrado', value: 'Bs 2.145,50', d: I.pay },
{ label: 'Usuarios nuevos', value: '18', d: I.user },
{ label: 'Emergencias', value: '1', d: I.sos }
]
};
}
}
</script>
</body>
</html>
