<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Detalle del pedido</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>body{margin:0;font-family:'Plus Jakarta Sans',sans-serif}button,input{font-family:inherit}</style>
</helmet>
<div style="width:800px;height:1160px;box-sizing:border-box;padding:28px 40px;background:linear-gradient(rgba(15,23,42,.06),rgba(15,23,42,.06)),#E9EEF5;color:#0F172A;font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden">
<div style="width:720px;box-sizing:border-box;background:#FFFFFF;border-radius:16px;box-shadow:0 24px 60px rgba(15,23,42,.18);display:flex;flex-direction:column">
<div style="padding:20px 24px 14px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid #EEF1F5">
<div style="width:42px;height:42px;border-radius:12px;background:#EAF2FF;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6M9 15h4"/></svg></div>
<div style="flex:1"><div style="font-size:20px;font-weight:800;letter-spacing:-.3px">Pedido · 7f3a91c2</div>
<div style="display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;font-weight:800">Estado:<span style="display:flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:#EAF2FF;font-size:11px;color:#2563EB"><span style="width:6px;height:6px;border-radius:3px;background:#2563EB"></span>Confirmado</span><span style="color:#98A2B3">·</span>Pago:<span style="display:flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:#FFF7E6;font-size:11px;color:#B54708"><span style="width:6px;height:6px;border-radius:3px;background:#B54708"></span>En revisión</span></div></div>
</div>
<div style="padding:16px 24px;display:flex;flex-direction:column;gap:12px">
<div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:14px;padding:12px 16px">
<sc-for list="{{main}}" as="r" hint-placeholder-count="5">
<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:13px"><span style="font-weight:600;color:#475467">{{r.l}}</span><span style="font-weight:800;color:{{r.ink}}">{{r.v}}</span></div>
</sc-for>
<div style="height:1px;background:#E2E8F0;margin:6px 0"></div>
<sc-for list="{{balances}}" as="r" hint-placeholder-count="6">
<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:13px"><span style="font-weight:600;color:#475467">{{r.l}}</span><span style="font-weight:800;color:{{r.ink}}">{{r.v}}</span></div>
</sc-for>
<div style="height:1px;background:#E2E8F0;margin:6px 0"></div>
<div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;font-weight:800">Liquidación:<span style="display:flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:#FFF7E6;font-size:11px;color:#B54708"><span style="width:6px;height:6px;border-radius:3px;background:#B54708"></span>Pendiente</span></div>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<sc-for list="{{settle}}" as="b" hint-placeholder-count="2">
<button style="height:36px;padding:0 12px;border-radius:10px;border:1px solid #D0D5DD;background:#FFFFFF;color:#0F172A;font-size:12px;font-weight:800;display:flex;align-items:center;gap:7px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.d}}"/></svg>{{b.t}}</button>
</sc-for>
</div>
<div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:14px;padding:12px 14px">
<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/></svg><span style="font-size:13px;font-weight:800">Chat / comprobantes</span></div>
<sc-for list="{{chat}}" as="m" hint-placeholder-count="4">
<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #EEF1F5">
<div style="width:30px;height:30px;border-radius:9px;background:#FFFFFF;border:1px solid #E2E8F0;display:flex;align-items:center;justify-content:center;flex:none"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/></svg></div>
<div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:700;color:{{m.ink}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{m.b}}</div><div style="font-size:11px;font-weight:600;color:#64748B">{{m.s}}</div></div>
</div>
</sc-for>
</div>
<div style="display:flex;gap:10px">
<button style="flex:1;height:40px;border-radius:10px;border:1px solid #F0B8BF;background:#FFFFFF;color:#D92D20;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D92D20" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>Rechazar comprobante</button>
<button style="flex:1;height:40px;border-radius:10px;border:0;background:#14804A;color:#FFFFFF;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>Aprobar transferencia</button>
</div>
<button style="width:100%;height:40px;border-radius:10px;border:0;background:#2563EB;color:#FFFFFF;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 01-16 0zM8 7c0-1 1-1.5 1-2.5M12 7c0-1 1-1.5 1-2.5M16 7c0-1 1-1.5 1-2.5"/></svg>Pasar a preparación</button>
<button style="width:100%;height:40px;border-radius:10px;border:1px solid #D0D5DD;background:#FFFFFF;color:#0F172A;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h20v12H2zM2 10h20M6 15h4"/></svg>Confirmar pago al repartidor</button>
</div>
<div style="padding:12px 24px 18px;border-top:1px solid #EEF1F5;display:flex;justify-content:flex-end">
<button style="height:40px;padding:0 14px;border-radius:10px;border:0;background:transparent;color:#2563EB;font-size:13px;font-weight:800">Cerrar</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":1160}}'>
class Component extends DCLogic {
renderVals() {
const dk = '#0F172A';
const z = '#98A2B3';
return {
main: [
{ l: 'Total cliente', v: 'CLP 18.450', ink: '#2563EB' },
{ l: 'Productos comercio', v: 'CLP 13.900', ink: dk },
{ l: 'Pago repartidor', v: 'CLP 2.800', ink: dk },
{ l: 'Propina', v: 'CLP 400', ink: dk },
{ l: 'Margen Express', v: 'CLP 1.350', ink: dk }
],
balances: [
{ l: 'Comercio debe al repartidor', v: 'CLP 3.200', ink: dk },
{ l: 'Comercio debe a Express', v: 'CLP 1.350', ink: dk },
{ l: 'Repartidor debe al comercio', v: 'CLP 0', ink: z },
{ l: 'Repartidor debe a Express', v: 'CLP 0', ink: z },
{ l: 'Express debe al comercio', v: 'CLP 0', ink: z },
{ l: 'Express debe al repartidor', v: 'CLP 500', ink: dk }
],
settle: [
{ t: 'Cerrar saldo Comercio → Express', d: 'M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18' },
{ t: 'Cerrar saldo Express → repartidor', d: 'M5 18a3 3 0 100-6 3 3 0 000 6zM19 18a3 3 0 100-6 3 3 0 000 6zM8 15h6l3-5h-4M13 7h3' }
],
chat: [
{ b: 'Hola, ya hice la transferencia por el total.', s: 'Cliente · Texto', ink: dk },
{ b: 'https://…/marketplace-receipts/7f3a91c2/comprobante-bancoestado.jpg', s: 'Cliente · Comprobante', ink: '#2563EB' },
{ b: 'Recibido, lo revisamos y confirmamos en unos minutos.', s: 'Comercio · Texto', ink: dk },
{ b: 'Pedido confirmado por el comercio.', s: 'Sistema · Estado', ink: dk }
]
};
}
}
</script>
</body>
</html>
