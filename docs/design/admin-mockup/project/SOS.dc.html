<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Seguridad / SOS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>body{margin:0;font-family:'Plus Jakarta Sans',sans-serif}button,input{font-family:inherit}</style>
</helmet>
<div style="width:1280px;height:1160px;display:flex;background:#F1F5F9;color:#0F172A;font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden">
<dc-import name="Sidebar" active="Seguridad / SOS" hint-size="248px,1160px"></dc-import>
<div style="flex:1;min-width:0;display:flex;flex-direction:column">
<dc-import name="Topbar" title="Seguridad / SOS" env="preview" scope="admin" hint-size="1032px,168px"></dc-import>
<main style="flex:1;min-height:0;padding:22px 24px;display:flex;flex-direction:column;gap:16px">
<div style="border-radius:20px;padding:20px 24px;background:linear-gradient(120deg,#0F2854,#174B91 55%,#0D6B8D);color:#FFFFFF;display:flex;align-items:center;gap:16px;box-shadow:0 10px 30px rgba(23,75,145,.25)">
<div style="width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></div>
<div style="flex:1"><div style="font-size:24px;font-weight:800;letter-spacing:-.4px">Seguridad / SOS</div><div style="font-size:13px;color:#D7E7FA;font-weight:600;margin-top:4px">Emergencias activas registradas desde Viajes y Delivery.</div></div>
</div>
<div style="background:#FFFFFF;border:1px solid #E7ECF3;border-radius:14px;padding:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
<label style="height:36px;width:240px;box-sizing:border-box;border:1px solid #D0D5DD;border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 11px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round"><path d="M11 18a7 7 0 100-14 7 7 0 000 14zM20 20l-3.5-3.5"/></svg><input type="text" placeholder="Buscar" style="border:0;outline:0;flex:1;min-width:0;font-size:13px;color:#0F172A;background:transparent"></label>
<sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
<button style="height:32px;padding:0 12px;border-radius:999px;border:1px solid {{c.line}};background:{{c.bg}};color:{{c.ink}};font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:3px;background:{{c.dot}}"></span>{{c.label}}</button>
</sc-for>
<span style="flex:1"></span>
<button style="height:36px;padding:0 14px;border-radius:10px;border:1px solid #D0D5DD;background:#FFFFFF;color:#0F172A;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:7px"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg>Exportar</button>
</div>
<div style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="display:flex;align-items:center;gap:14px;background:#FFFFFF;border:1px solid {{r.line}};border-left:4px solid {{r.accent}};border-radius:16px;padding:14px 16px">
<div style="width:44px;height:44px;flex:none;border-radius:22px;background:#FFE4E8;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#D92D20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM12 8v5M12 16h.01"/></svg></div>
<div style="flex:1;min-width:0">
<div style="font-size:14.5px;font-weight:800">{{r.name}}</div>
<div style="display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12.5px;color:#64748B;font-weight:600">
<span style="display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;background:{{r.sbg}};color:{{r.sfg}};font-size:11px;font-weight:800"><span style="width:6px;height:6px;border-radius:3px;background:{{r.sfg}}"></span>{{r.status}}</span>
<span>{{r.date}}</span>
</div>
</div>
<button style="height:40px;padding:0 16px;border-radius:10px;border:0;background:#2563EB;color:#FFFFFF;font-size:13px;font-weight:800;display:flex;align-items:center;gap:7px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 100-18 9 9 0 000 18zM8 12l3 3 5-6"/></svg>Resolver</button>
</div>
</sc-for>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1160}}'>
class Component extends DCLogic {
renderVals() {
const ST = { open: ['Abierta', '#D92D20', '#FFE4E8'], acknowledged: ['Atendida', '#B54708', '#FFF7E6'] };
const row = (name, st, date) => ({ name, status: ST[st][0], sfg: ST[st][1], sbg: ST[st][2], date, accent: st === 'open' ? '#D92D20' : '#F5C36A', line: st === 'open' ? '#F6CDD2' : '#F1E3C2' });
return {
chips: [
{ label: 'Todos (4)', dot: '#2563EB', bg: '#EAF2FF', line: '#BFD3F9', ink: '#2563EB' },
{ label: 'Abierta', dot: '#D92D20', bg: '#FFFFFF', line: '#E4E7EC', ink: '#0F172A' },
{ label: 'Atendida', dot: '#B54708', bg: '#FFFFFF', line: '#E4E7EC', ink: '#0F172A' }
],
rows: [
row('QA Pasajero Trinidad 01', 'open', '10/10/2026 · 10:44'),
row('QA Pasajero Trinidad 03', 'open', '10/10/2026 · 10:12'),
row('Usuario Express', 'acknowledged', '10/10/2026 · 09:37'),
row('QA Repartidor 01', 'acknowledged', '09/10/2026 · 22:18')
]
};
}
}
</script>
</body>
</html>
