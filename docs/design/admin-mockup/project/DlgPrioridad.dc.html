<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Configurar prioridad</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>body{margin:0;font-family:'Plus Jakarta Sans',sans-serif}button,input{font-family:inherit}</style>
</helmet>
<div style="width:760px;height:960px;box-sizing:border-box;background:#E9EEF5;color:#0F172A;font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden">
<div style="width:760px;height:960px;box-sizing:border-box;background:rgba(15,23,42,.06);padding:40px 55px;display:flex;justify-content:center;align-items:flex-start">
<div style="width:650px;background:#FFFFFF;border-radius:16px;box-shadow:0 24px 60px rgba(15,23,42,.18);overflow:hidden">
<div style="padding:18px 20px 10px;display:flex;gap:12px;align-items:center"><span style="width:38px;height:38px;border-radius:11px;background:#EAF2FF;flex:none;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 6 6 .9-4.5 4.4 1 6.2L12 16.6 6.5 19.5l1-6.2L3 8.9 9 8z"/></svg></span><div><div style="font-size:19px;font-weight:800;letter-spacing:-.2px">Configurar prioridad de conductores</div><div style="font-size:12px;color:#64748B;font-weight:600">Producción · Bolivia · Trinidad</div></div></div>
<div style="padding:0 20px 14px;display:flex;flex-direction:column;gap:12px">
<div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:14px;padding:2px 14px">
<sc-for list="{{sw}}" as="s" hint-placeholder-count="4">
<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid {{s.line}};opacity:{{s.op}}">
<div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:800">{{s.l}}</div><div style="font-size:11.5px;color:#64748B;font-weight:600">{{s.sub}}</div></div>
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{s.lk}}" stroke-width="2.2" stroke-linecap="round"><path d="M6 11h12v10H6zM8 11V7a4 4 0 018 0v4"/></svg>
<span role="switch" aria-checked="{{s.on}}" style="width:40px;height:24px;border-radius:12px;background:{{s.bg}};position:relative;display:inline-block;flex:none"><span style="position:absolute;top:3px;left:{{s.k}}px;width:18px;height:18px;border-radius:9px;background:#FFFFFF;box-shadow:0 1px 2px rgba(15,23,42,.25)"></span></span>
</div>
</sc-for>
</div>
<sc-for list="{{sections}}" as="g" hint-placeholder-count="3">
<div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:14px;padding:12px 14px">
<div style="display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;margin-bottom:8px"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{g.d}}"/></svg>{{g.t}}</div>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px">
<sc-for list="{{g.f}}" as="x" hint-placeholder-count="4">
<label style="display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:#64748B;min-width:0">{{x.l}}<span style="height:38px;box-sizing:border-box;border:1px solid #D0D5DD;border-radius:10px;background:#FFFFFF;display:flex;align-items:center;gap:6px;padding:0 10px"><input readonly value="{{x.v}}" style="flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;font-size:13px;font-weight:600;color:#0F172A;padding:0"><span style="font-size:12px;font-weight:700;color:#64748B">{{x.suf}}</span></span></label>
</sc-for>
</div>
</div>
</sc-for>
</div>
<div style="padding:12px 20px;border-top:1px solid #EEF1F5;display:flex;justify-content:flex-end;gap:8px"><button style="height:40px;padding:0 14px;border-radius:10px;border:0;background:transparent;color:#2563EB;font-size:13px;font-weight:800">Cancelar</button><button style="height:40px;padding:0 20px;border-radius:10px;border:0;background:#2563EB;color:#FFFFFF;font-size:13px;font-weight:800">Guardar</button></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":960}}'>
class Component extends DCLogic {
renderVals() {
const sw = (l, sub, on, locked, line) => ({ l: l, sub: sub, on: on ? 'true' : 'false', bg: on ? '#2563EB' : '#C5CEDD', k: on ? 19 : 3, op: locked ? '.5' : '1', lk: locked ? '#98A2B3' : 'transparent', line: line });
const f = (l, v, suf) => ({ l: l, v: v, suf: suf || '' });
return {
sw: [
sw('Mostrar prioridad en Preview', '', true, true, '#EEF1F5'),
sw('Aplicar ranking al despacho Preview', 'Ordena solicitudes, pero no bloquea conductores.', true, true, '#CBD5E1'),
sw('Mostrar prioridad en Producción', 'Puedes administrarlo por separado; Producción está preparada para aplicar el ranking seguro.', true, false, '#EEF1F5'),
sw('Aplicar ranking al despacho Producción', '', false, false, 'transparent')
],
sections: [
{ t: 'Umbrales', d: 'M4 20V10M10 20V4M16 20v-8M22 20H2', f: [f('Alta desde', '80', '/100'), f('Media desde', '55', '/100')] },
{ t: 'Pesos del puntaje', d: 'M12 3v18M5 7h14M5 7l-3 7a3 3 0 006 0zM19 7l-3 7a3 3 0 006 0z', f: [f('Reputación', '35'), f('Reseñas', '25'), f('Experiencia', '20'), f('Frecuencia', '20')] },
{ t: 'Metas para llegar a 100%', d: 'M12 21a9 9 0 100-18 9 9 0 000 18zM12 16a4 4 0 100-8 4 4 0 000 8zM12 12h.01', f: [f('Reseñas', '20'), f('Viajes experiencia', '100'), f('Viajes / 30 días', '30')] }
]
};
}
}
</script>
</body>
</html>
