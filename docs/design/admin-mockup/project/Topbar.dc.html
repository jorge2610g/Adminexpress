<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Barra superior</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>body{margin:0}button{font-family:inherit}</style>
</helmet>
<div style="width:1032px;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;color:#0F172A;background:#F1F5F9">
<div style="height:72px;box-sizing:border-box;background:#FFFFFF;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;gap:12px;padding:0 24px">
<div style="width:36px;height:36px;border-radius:10px;background:#EAF2FF;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/></svg></div>
<div style="flex:1"><div style="font-size:9.5px;font-weight:800;letter-spacing:1.1px;color:#64748B">ADMINISTRACIÓN</div><div style="font-size:16px;font-weight:800">{{title}}</div></div>
<sc-if value="{{showNewTrip}}" hint-placeholder-val="{{ true }}"><button style="height:40px;padding:0 16px;border-radius:10px;border:0;background:#2563EB;color:#FFFFFF;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nuevo viaje</button></sc-if>
<button aria-label="Actualizar" style="width:40px;height:40px;border-radius:10px;border:1px solid #E2E8F0;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/></svg></button>
<button aria-label="Notificaciones" style="position:relative;width:40px;height:40px;border-radius:10px;border:1px solid #E2E8F0;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 1112 0v6l2 2H4zM10 21h4"/></svg></button>
<button style="height:40px;display:flex;align-items:center;gap:8px;padding:0 10px 0 6px;border-radius:12px;border:1px solid #E2E8F0;background:#F8FAFC"><span style="width:28px;height:28px;border-radius:14px;background:#DBEAFE;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/></svg></span><span style="font-size:12px;font-weight:800">{{roleName}}</span><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
</div>
<div style="height:40px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:0 24px;background:{{envBg}};border-bottom:1px solid {{envLine}}">
<span style="width:8px;height:8px;border-radius:4px;background:{{envInk}}"></span>
<span style="flex:1;font-size:12px;font-weight:800;letter-spacing:.3px;color:{{envText}}">{{envLabel}}</span>
<button style="height:28px;padding:0 12px;border-radius:8px;border:1px solid {{linkBorder}};background:#FFFFFF;color:{{linkInk}};font-size:11.5px;font-weight:800;display:flex;align-items:center;gap:6px"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{linkInk}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13l-4-4M17 17H4l4 4"/></svg>{{linkLabel}}</button>
</div>
<sc-if value="{{scopeAdmin}}" hint-placeholder-val="{{ true }}">
<div style="height:56px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:0 24px;background:#F8FAFC;border-bottom:1px solid #E2E8F0">
<span style="display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>Ámbito obligatorio</span>
<label style="display:flex;flex-direction:column;font-size:9.5px;font-weight:700;color:#64748B;gap:2px">País<span style="height:30px;width:180px;box-sizing:border-box;border:1px solid #D0D5DD;border-radius:9px;background:#FFFFFF;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:12.5px;font-weight:700;color:#0F172A">{{country}}<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></span></label>
<label style="display:flex;flex-direction:column;font-size:9.5px;font-weight:700;color:#64748B;gap:2px">Zona<span style="height:30px;width:220px;box-sizing:border-box;border:1px solid #D0D5DD;border-radius:9px;background:#FFFFFF;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:12.5px;font-weight:700;color:#0F172A">{{zone}}<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></span></label>
</div>
</sc-if>
<sc-if value="{{scopeMonitor}}" hint-placeholder-val="{{ false }}">
<div style="height:44px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:0 24px;background:#F0FDF4;border-bottom:1px solid #BBF7D0;color:#166534">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
<span style="flex:1;font-size:12px;font-weight:800">Monitor de zona · Bolivia · Trinidad</span>
<span style="font-size:11px;font-weight:800">Solo lectura</span>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Dashboard"},"env":{"editor":"enum","options":["preview","production"],"default":"preview"},"scope":{"editor":"enum","options":["admin","monitor","none"],"default":"admin"},"$preview":{"width":1032,"height":168}}'>
class Component extends DCLogic {
renderVals() {
const prod = (this.props.env ?? 'preview') === 'production';
const scope = this.props.scope ?? 'admin';
return {
title: this.props.title ?? 'Dashboard',
showNewTrip: scope !== 'monitor',
roleName: scope === 'monitor' ? 'Monitor de zona' : 'Administrador',
scopeAdmin: scope === 'admin',
scopeMonitor: scope === 'monitor',
country: 'Bolivia',
zone: 'Trinidad · Trinidad',
envBg: prod ? '#E8F8EF' : '#FFF7E6',
envLine: prod ? '#B7E4C7' : '#F5D58A',
envInk: prod ? '#14804A' : '#B54708',
envText: prod ? '#0F6848' : '#7A2E0E',
envLabel: prod ? 'EXPRESS PRODUCCIÓN · Datos reales' : 'EXPRESS PREVIEW · Solo registros de prueba',
linkLabel: prod ? 'Ir a Prueba' : 'Ir a Producción',
linkInk: prod ? '#7A2E0E' : '#0F6848',
linkBorder: prod ? '#F5C36A' : '#9AD8B3'
};
}
}
</script>
</body>
</html>
