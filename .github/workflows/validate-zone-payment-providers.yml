name: Validate Zone Payment Providers

on:
  push:
    branches:
      - feature/zone-payment-providers
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-zone-payment-providers-validate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze payment and subscription admin
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/admin_control_sections.dart \
            lib/admin_driver_subscriptions.dart \
            lib/admin_panel.dart

      - name: Build admin web
        run: flutter build web --release --base-href /Adminexpress/
