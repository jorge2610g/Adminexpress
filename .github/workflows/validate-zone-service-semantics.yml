name: Validate zone service admin semantics

on:
  push:
    branches:
      - feat/zone-service-visibility-semantics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/admin_control_sections.dart
      - run: flutter build web --release --base-href /Adminexpress/
