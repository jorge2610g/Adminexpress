name: Validate Admin Preview Production Split

on:
  push:
    branches:
      - main
      - feature/delivery-modules-merchant-dashboard
      - refactor/unified-preview-production-panel
      - fix/admin-live-channel-badges-20261006
      - fix/admin-geo-scope-identity-20261007
      - fix/admin-audit-readiness-20261007
      - feat/admin-runtime-scope-isolation-20261007
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Enforce identical Preview and Production panel tree
        run: |
          if grep -q "AdminPreviewModulePage" lib/admin_panel.dart; then
            echo "ERROR: Preview cannot use a different page tree from Production."
            exit 1
          fi
          if grep -q "get groups => channel == 'preview'" lib/admin_panel.dart; then
            echo "ERROR: Navigation must be identical in Preview and Production."
            exit 1
          fi
          grep -q "AdminZonesPage(" lib/admin_panel.dart
          grep -q "AdminFaresPage(" lib/admin_panel.dart
          grep -q "AdminPaymentsPage(" lib/admin_panel.dart
          grep -q "AdminSettingsPage(channel: adminChannel)" lib/admin_panel.dart
          grep -q "AdminServicesPage(" lib/admin_panel.dart
          grep -q "AdminGeoSafetyPage(" lib/admin_panel.dart
          grep -q "AdminIdentitySecurityPage(" lib/admin_panel.dart
          grep -q "AdminAdvancedSettingsPage(channel: adminChannel)" lib/admin_panel.dart
          grep -q "AdminDriverSubscriptionsPage(" lib/admin_panel.dart

      - name: Enforce hard Admin runtime scope
        run: |
          test -f lib/admin_runtime_scope.dart
          grep -q "AdminRuntimeScope(" lib/admin_panel.dart
          grep -q "KeyedSubtree(" lib/admin_panel.dart
          grep -q "admin_set_driver_approval_v2" lib/admin_panel.dart
          grep -q "admin_set_account_status_v2" lib/admin_panel.dart
          grep -q "admin_resolve_emergency_v2" lib/admin_panel.dart
          grep -q "admin_driver_detail_v2" lib/admin_detail_dialogs.dart
          grep -q "admin_user_detail_v2" lib/admin_detail_dialogs.dart
          grep -q "admin_trip_detail_v2" lib/admin_detail_dialogs.dart
          grep -q "admin_update_driver_profile_v2" lib/admin_detail_dialogs.dart
          grep -q "admin_update_user_profile_v2" lib/admin_detail_dialogs.dart
          grep -Fq "const AdminEnvironmentStore('production')" lib/admin_driver_document_requirements.dart
          grep -q "admin_driver_document_requirement_list" lib/admin_driver_document_requirements.dart

          for legacy in             "'admin_set_driver_approval'"             "'admin_set_account_status'"             "'admin_resolve_emergency'"; do
            if grep -q "$legacy" lib/admin_panel.dart; then
              echo "ERROR: sensitive Admin action still bypasses runtime scope: $legacy"
              exit 1
            fi
          done

          for legacy in             "'admin_driver_detail'"             "'admin_user_detail'"             "'admin_trip_detail'"             "'admin_update_driver_profile'"             "'admin_update_user_profile'"             "'admin_upsert_driver_document'"; do
            if grep -q "$legacy" lib/admin_detail_dialogs.dart; then
              echo "ERROR: detail/editor RPC still bypasses runtime scope: $legacy"
              exit 1
            fi
          done

      - name: Assert Builds, Audit and Reports are system-global without breaking operational scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          panel = Path('lib/admin_panel.dart').read_text()
          builds = Path('lib/admin_single_app_release.dart').read_text()
          reports = Path('lib/admin_environment_reports.dart').read_text()
          audit = Path('lib/admin_environment_audit.dart').read_text()
          checks = {
            'only Reports, Builds and Audit bypass zone scope':
              'static const Set<int> _globalSections = {10, 12, 14};' in panel
              and '!_globalSections.contains(selectedSection)' in panel,
            'environment switch hidden for system-global modules':
              'if (!_globalSections.contains(section))\n                          _environmentSwitcher(),' in panel,
            'country/zone switch hidden for system-global modules':
              'if (_requiresZoneScope(section))\n                          _globalGeoScopeSwitcher(),' in panel,
            'other sections still require selected zone':
              'if (_requiresZoneScope(value) && !_scopeReady)' in panel,
            'Builds cache scope excludes country/zone':
              'countryCode: _requiresZoneScope(section)' in panel
              and 'zoneId: _requiresZoneScope(section)' in panel,
            'zone monitor access stays restricted':
              'if (_isZoneMonitor &&' in panel,
            'Builds publication controls require production access permission':
              'return AdminSingleAppReleasePage(' in panel
              and 'productionAccess: allowProduction' in panel
              and 'bool get canManage => widget.productionAccess;' in builds,
            'unified Reports view only queries authorized environments':
              'includePreview: allowPreview' in panel
              and 'includeProduction: allowProduction' in panel
              and "supabase.rpc('admin_report_summary_v2'" in reports
              and "if (widget.includeProduction)" in reports
              and "if (widget.includePreview)" in reports
              and "'p_channel': channel" in reports
              and "widget.channel" not in reports,
            'unified Audit retains origin and chronological ordering':
              "supabase.rpc('admin_audit_list_v2'" in audit
              and 'source_channel' in audit
              and "rows.sort(" in audit
              and "if (widget.includeProduction)" in audit
              and "if (widget.includePreview)" in audit
              and "'p_channel': channel" in audit
              and "widget.channel" not in audit,
            'no Preview/Production UI switch embedded in shared pages':
              "SegmentedButton" not in reports
              and "SegmentedButton" not in audit
              and "SegmentedButton" not in builds,
          }
          for description, success in checks.items():
            if not success:
              raise SystemExit('FAIL: ' + description)
          print('PASS: global Builds, Audit, Reports; operational geo + access guards intact.')
          PY

      - name: Guard manual-only identity dashboard and environment separation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code = Path('lib/admin_control_sections.dart').read_text()
          module = code.split('class AdminIdentitySecurityPage extends StatelessWidget {', 1)[1].split(
              'class _PolygonEditor extends StatelessWidget {', 1)[0]
          forbidden = [
              'admin_identity_verification_list_scoped',
              'admin_identity_settings_get',
              'admin_identity_resolve',
              'identity_verifications',
              'identity_verification_settings',
          ]
          # Comments can document retired tables, but active UI cannot query them.
          statements = '\n'.join(line for line in module.splitlines() if not line.strip().startswith('///'))
          assert all(legacy not in statements for legacy in forbidden), 'Legacy identity requests remain in the live screen'
          assert "('Motor', 'Manual')" in module, 'Automatic provider still appears as active'
          assert 'AdminDriverDocumentRequirementsPanel(' in module, 'Document requirements must remain available'
          assert 'channel: channel' in module and 'zoneId: zoneId' in module, 'Keep environment and zone scope'
          manual = Path('lib/admin_manual_identity.dart').read_text()
          assert 'AdminBoliviaKycPanel(' in manual, 'Manual document reviews must remain accessible'
          print('PASS: production/preview identity UI is manual-only, no legacy session feed.')
          PY

      - name: Guard shared Supabase and fail-closed Preview routing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          config = Path('lib/core/supabase_client.dart').read_text()
          panel = Path('lib/admin_panel.dart').read_text()
          env_store = Path('lib/admin_environment_store.dart').read_text()
          login = Path('lib/main.dart').read_text()
          workflow = Path('.github/workflows/deploy-web.yml').read_text()
          assert 'zgpijrznvaskgcmauwxx' in config
          assert 'xbphilqezmwfjfpdbwad' not in config
          assert 'const supabaseUrl = _productionUrl;' in config
          assert 'const supabasePublishableKey = _productionPublishableKey;' in config
          assert "adminRuntimeChannel = adminIsPreview ? 'preview' : 'production'" in config
          assert 'validateAdminDeployment()' in config
          assert "String adminChannel = adminIsPreview ? 'preview' : 'production';" in panel
          assert 'SegmentedButton<String>(' not in panel.split('Widget _environmentSwitcher() {')[1].split('void _goTo(', 1)[0]
          assert 'allowPreview = adminIsPreview' in panel
          assert 'allowProduction = !adminIsPreview' in panel
          assert "admin_zone_list_for_country" in panel
          assert "admin_country_list_scoped" in panel
          # Fail-closed store (aaae599): isPreview validates the channel first.
          assert "bool get isPreview {" in env_store and "return channel == 'preview';" in env_store
          # Business settings are shared; account, identity review, trip and
          # payment operations still require runtime channel isolation.
          for name in ['_AdminZonesPageState','_AdminGeoSafetyPageState',
                       '_AdminServicesPageState','_AdminFaresPageState',
                       '_AdminSettingsPageState']:
              section = Path('lib/admin_control_sections.dart').read_text().split(
                  'class '+name,1)[1].split('class ',1)[0]
              assert "const AdminEnvironmentStore('production')" in section
          assert "AdminManualIdentityPage(" in panel and "AdminIdentitySecurityPage(" in panel
          assert "AdminDistanceFaresEditor(" in Path('lib/admin_control_sections.dart').read_text()
          assert 'productionAccess: allowProduction && !adminIsPreview' in panel
          assert 'static const Set<int> _previewScopedModules' in panel
          assert 'if (adminIsPreview && !_previewScopedModules.contains(value))' in panel
          for safe in ['0','1','2','3','4','5','6','8','10','11','14','16','18','22','25','27']:
              assert safe in panel.split('_previewScopedModules = {')[1].split('}',1)[0].replace(',',' ').split()
          for blocked in ['7','9','12','13','15','17','19','20','21','23','24','26','28']:
              assert blocked not in panel.split('_previewScopedModules = {')[1].split('}',1)[0].replace(',',' ').split()
          assert 'if (adminIsPreview) return _ExpressPanelAccess.denied;' in login
          assert '--dart-define=ADMIN_ENV=production' in workflow
          assert '--dart-define=ADMIN_ENV=preview' in workflow
          assert '--base-href /preview/' in workflow
          assert 'path: build/site' in workflow
          assert 'preview_source_sha' in workflow
          assert "const supabaseUrl = _productionUrl;" in workflow
          navigation = Path('lib/core/admin_environment_navigation.dart').read_text()
          assert "adminIsPreview ? 'Ir a Producción' : 'Ir a Prueba'" in navigation
          assert "Uri.base.resolve(adminIsPreview ? '../' : 'preview/')" in navigation
          assert "webOnlyWindowName: '_self'" in navigation
          assert 'AdminEnvironmentLinkButton()' in panel
          assert 'AdminEnvironmentLinkButton()' in login
          print('PASS: same physical Supabase; immutable Preview channel; unsafe modules fail closed.')
          PY

      - name: Preview 22/25 guards (subscriptions and driver priority)
        shell: bash
        run: |
          python3 -I - <<'PY'
          from pathlib import Path
          env_store = Path('lib/admin_environment_store.dart').read_text()
          panel = Path('lib/admin_panel.dart').read_text()
          assert "void _assertValidChannel()" in env_store
          assert "throw StateError('Canal administrativo inválido: operación bloqueada')" in env_store
          assert "return channel == 'preview';" in env_store
          assert "return channel == 'production';" in env_store
          assert "bool get isProduction => !isPreview;" not in env_store
          for safe in ['0','1','2','3','4','5','6','8','10','11','14','16','18','22','25','27']:
              assert safe in panel.split('_previewScopedModules = {')[1].split('}',1)[0].replace(',',' ').split()
          # Subscriptions (22) must not download real driver data to Preview.
          subscriptions = Path('lib/admin_driver_subscriptions.dart').read_text()
          assert "'admin_preview_driver_subscription_candidates'" in subscriptions
          assert "'p_zone_id': widget.zoneId" in subscriptions
          assert "'p_search': search.text.trim()" in subscriptions
          preview_code = subscriptions.split('if (_environment.isPreview) {', 1)[1].split('return;', 1)[0]
          assert "'admin_driver_subscriptions'" not in preview_code
          assert "'admin_preview_driver_subscription_candidates'" in preview_code
          assert "'driver_subscriptions'" in preview_code
          assert "_environment.previewUpsert(" in subscriptions
          assert "selectedZone == null || _environment.isPreview" in subscriptions
          assert "if (driver['is_qa'] == true) return true;" in subscriptions
          assert "if (!_environment.isPreview &&" in subscriptions
          # Server RPC is additive, auth-guarded and read-only; never copies
          # any live driver subscription into client side QA data.
          sql = Path('docs/preview/migrations/20261011_shared_db_subscriptions_qa_candidates.sql').read_text()
          assert "admin_environment_allowed('preview')" in sql
          assert "audit_test_group_members" in sql
          assert "REVOKE ALL" in sql
          assert "INSERT INTO" not in sql.upper()
          assert "UPDATE public." not in sql
          # Server calls for Priority (25) are scoped by channel and QA driver.
          priority = Path('lib/admin_driver_priority.dart').read_text()
          assert "'admin_driver_priority_state_scoped'" in priority
          assert "'admin_update_driver_priority_settings_v2'" in priority
          assert "'p_channel': widget.channel" in priority
          assert "widget.channel == 'preview'" in priority
          assert "'p_enabled': widget.channel == 'preview'" in priority
          assert "'p_zone_id': zoneId" in priority

          # Regression: subscriptions is section 22 and must be accessible
          # with the shared backend, while unsafe modules remain guarded.
          assert "('Suscripciones', Icons.workspace_premium_rounded)" in panel
          assert "case 22:" in panel
          assert "return AdminDriverSubscriptionsPage(" in panel
          assert "'Este módulo todavía no tiene aislamiento seguro por canal." in panel
          print('PASS: subscriptions (22) and driver priority (25) are Preview-safe.')
          PY

      - name: Store channel tests (fail closed)
        run: |
          flutter test test/admin_environment_store_test.dart

      - name: Analyze admin modules
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/admin_panel.dart \
            lib/main.dart \
            lib/core/supabase_client.dart \
            lib/admin_single_app_release.dart \
            lib/admin_environment_reports.dart \
            lib/admin_environment_audit.dart \
            lib/admin_control_sections.dart \
            lib/admin_driver_subscriptions.dart \
            lib/admin_environment_store.dart \
            lib/core/admin_environment_navigation.dart \
            lib/admin_marketplace.dart \
            lib/admin_marketplace_phase2.dart \
            lib/admin_driver_priority.dart \
            lib/admin_dynamic_pricing.dart \
            lib/admin_manual_identity.dart \
            lib/admin_driver_document_requirements.dart
      - name: Verify active polygon vs radio zone labels
        run: flutter test test/admin_zone_coverage_label_test.dart
      - name: Build admin production web smoke test
        run: flutter build web --release --dart-define=ADMIN_ENV=production
      - name: Build admin shared-database Preview web smoke test
        run: flutter build web --release --base-href /preview/ --dart-define=ADMIN_ENV=preview
