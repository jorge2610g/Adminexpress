name: Validate Adminexpress Central Access

on:
  push:
    branches:
      - main
      - feat/single-admin-by-user-20261011
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify single canonical backend and login routing
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const supabaseUrl = _productionUrl;" lib/core/supabase_client.dart
          grep -Fq "https://admin.expressviajes.online/" lib/core/supabase_client.dart
          grep -Fq "admin_access_context" lib/main.dart
          if grep -Fq "supabase.rpc('is_admin')" lib/main.dart; then
            echo "ERROR: login still rejects scoped admin roles before reading their access context."
            exit 1
          fi
          if grep -Fq "ADMIN_ENV" lib/core/supabase_client.dart; then
            echo "ERROR: web build still decides Preview/Production."
            exit 1
          fi
          echo "PASS: authenticated account decides the runtime environment."

      - name: Verify user role, zone and module permissions
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "allowed_modules" lib/admin_panel.dart
          grep -Fq "_sectionModuleKeys" lib/admin_panel.dart
          grep -Fq "_sectionAllowed" lib/admin_panel.dart
          grep -Fq "allowedSections: _allowedSections" lib/admin_panel.dart
          grep -Fq "admin_country_list_scoped" lib/admin_panel.dart
          grep -Fq "admin_zone_list_for_country" lib/admin_panel.dart
          python3 - <<'PY'
          from pathlib import Path
          panel = Path('lib/admin_panel.dart').read_text()
          assert "if (index == 18 || index == 27) return false;" in panel
          assert "readOnly: _readOnly" in panel
          assert "if (!_sectionAllowed(value)) return;" in panel
          assert "_previewScopedModules" not in panel
          assert "AdminEnvironmentLinkButton" not in panel
          print("PASS: module navigation is user-scoped; old standalone identity routes are unreachable.")
          PY

      - name: Verify database migration for central access
        shell: bash
        run: |
          set -euo pipefail
          FILE="supabase/migrations/20261011211000_single_admin_access_scope.sql"
          test -f "$FILE"
          grep -Fq "add column if not exists allowed_modules text[]" "$FILE"
          grep -Fq "create or replace function public.admin_access_context()" "$FILE"
          grep -Fq "admin_set_panel_access_v2" "$FILE"
          grep -Fq "public.is_admin()" "$FILE"
          grep -Fq "account_runtime_bindings" "$FILE"
          echo "PASS: database changes are versioned and super-admin guarded."

      - name: Verify canonical deployment workflow
        shell: bash
        run: |
          set -euo pipefail
          FILE=".github/workflows/deploy-web.yml"
          grep -Fq "name: Deploy Adminexpress Central" "$FILE"
          grep -Fq "flutter build web --release --base-href /" "$FILE"
          grep -Fq '"mode": "account_scoped"' "$FILE"
          grep -Fq "Redirect old Preview URL to the central admin" "$FILE"
          if grep -Fq -- "--base-href /preview/" "$FILE"; then
            echo "ERROR: a second Preview web bundle is still being built."
            exit 1
          fi
          echo "PASS: one web bundle is deployed; /preview/ only redirects to the canonical URL."

      - name: Verify admin design gates when present
        shell: bash
        run: |
          if [ -f .github/scripts/verify_admin_mockup_stages.py ]; then
            python3 .github/scripts/verify_admin_mockup_stages.py
          else
            echo "SKIP: legacy mockup-stage verifier is not present on this ref."
          fi

      - name: Analyze central admin
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos             lib/main.dart             lib/admin_panel.dart             lib/core/supabase_client.dart             lib/admin_detail_dialogs.dart             lib/admin_control_sections.dart

      - name: Validate independent licence photo statuses
        run: flutter test test/driver_license_review_state_test.dart
