name: Deploy Adminexpress Central

# One canonical Adminexpress site. Preview vs Production is not a build choice:
# Supabase resolves the runtime environment from the authenticated account.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_admin_central:
        description: 'Type PUBLICAR ADMIN CENTRAL to deploy the canonical admin.'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: adminexpress-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[deploy-admin-central]')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.confirm_admin_central == 'PUBLICAR ADMIN CENTRAL')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical admin
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Guard single-admin architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "Adminexpress · Central" lib/main.dart
          grep -Fq "admin_access_context" lib/main.dart
          grep -Fq "const supabaseUrl = _productionUrl;" lib/core/supabase_client.dart
          grep -Fq "https://admin.expressviajes.online/" lib/core/supabase_client.dart
          grep -Fq "allowed_modules" lib/admin_panel.dart
          grep -Fq "_sectionAllowed" lib/admin_panel.dart
          grep -Fq "_sectionEnvironmentFilter" lib/admin_panel.dart
          grep -Fq "_environmentFilteredSections" lib/admin_panel.dart
          grep -Fq "Mostrar datos:" lib/admin_panel.dart
          if grep -Fq "_previewScopedModules" lib/admin_panel.dart; then
            echo "ERROR: obsolete Preview module blocker returned."
            exit 1
          fi
          if grep -Fq "AdminEnvironmentLinkButton" lib/admin_panel.dart; then
            echo "ERROR: the canonical admin must not switch websites/environments."
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          panel = Path('lib/admin_panel.dart').read_text()
          main = Path('lib/main.dart').read_text()
          assert "if (index == 18 || index == 27) return false;" in panel
          assert "allowedSections: _allowedSections" in panel
          assert "_sectionEnvironmentFilter" in panel
          assert "_environmentFilteredSections" in panel
          assert "admin_access_context" in main
          assert "supabase.rpc('is_admin')" not in main
          print("PASS: central admin is account-scoped and legacy identity navigation is blocked.")
          PY

      - name: Analyze central admin
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/main.dart \
            lib/admin_panel.dart \
            lib/core/supabase_client.dart \
            lib/admin_detail_dialogs.dart \
            lib/admin_control_sections.dart

      - name: Build one Adminexpress web app
        run: flutter build web --release --base-href /

      - name: Version browser entrypoints to prevent stale admin bundles
        shell: bash
        run: |
          set -euo pipefail
          RAW_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          BUILD_NUMBER="${RAW_VERSION##*+}"
          python3 - "$BUILD_NUMBER" <<'PY'
          from pathlib import Path
          import sys

          build = sys.argv[1]
          index_path = Path('build/web/index.html')
          index = index_path.read_text()
          old_script = 'src="flutter_bootstrap.js"'
          assert old_script in index, 'Flutter bootstrap script was not found in index.html'
          index_path.write_text(index.replace(old_script, f'src="flutter_bootstrap.js?v={build}"', 1))

          bootstrap_path = Path('build/web/flutter_bootstrap.js')
          bootstrap = bootstrap_path.read_text()
          loader_call = '_flutter.loader.load({'
          assert loader_call in bootstrap, 'Flutter loader call was not found in bootstrap script'
          version_entrypoint = (
              f"_flutter.buildConfig.builds.forEach((build) => {{ "
              f"build.mainJsPath = `main.dart.js?v={build}`; }});\n"
          )
          bootstrap_path.write_text(bootstrap.replace(loader_call, version_entrypoint + loader_call, 1))
          assert f'flutter_bootstrap.js?v={build}' in index_path.read_text()
          assert f'main.dart.js?v={build}' in bootstrap_path.read_text()
          PY

      - name: Write central version marker
        shell: bash
        run: |
          set -euo pipefail
          RAW_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          VERSION_NAME="${RAW_VERSION%%+*}"
          BUILD_NUMBER="${RAW_VERSION##*+}"
          DEPLOYED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > build/web/version.json <<EOF
          {
            "package": "${RAW_VERSION}",
            "version": "${VERSION_NAME}",
            "build": "${BUILD_NUMBER}",
            "display": "Adminexpress v${VERSION_NAME} · build ${BUILD_NUMBER}",
            "commit": "${GITHUB_SHA}",
            "deployed_at": "${DEPLOYED_AT}",
            "mode": "account_scoped",
            "canonical_url": "https://admin.expressviajes.online/",
            "supabase_project_ref": "zgpijrznvaskgcmauwxx"
          }
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: ${{ needs.build.result == 'success' }}
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy central admin
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify canonical admin is live
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE="https://admin.expressviajes.online"
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 20 -H "Cache-Control: no-cache"                 "$BASE/version.json?check=$EXPECTED_SHA" -o /tmp/version.json               && python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/version.json'))
          assert data.get('commit') == os.environ['EXPECTED_SHA']
          assert data.get('mode') == 'account_scoped'
          assert data.get('supabase_project_ref') == 'zgpijrznvaskgcmauwxx'
          print('PASS: canonical Adminexpress is live and account-scoped.')
          PY
            then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Canonical Adminexpress could not be verified."
          exit 1
