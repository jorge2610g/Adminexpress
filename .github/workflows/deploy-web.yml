name: Deploy Adminexpress Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: adminexpress-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href /Adminexpress/

      - name: Bust Flutter web cache
        shell: bash
        run: |
          sed -i "s#flutter_bootstrap.js#flutter_bootstrap.js?v=${GITHUB_SHA}#g" build/web/index.html
          if [ -f build/web/flutter_bootstrap.js ]; then
            sed -i "s#main.dart.js#main.dart.js?v=${GITHUB_SHA}#g" build/web/flutter_bootstrap.js
          fi

      - name: Write deployed version marker
        shell: bash
        run: |
          RAW_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          VERSION_NAME="${RAW_VERSION%%+*}"
          BUILD_NUMBER="${RAW_VERSION##*+}"
          DEPLOYED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          cat > build/web/version.json <<EOF
          {
            "package": "${RAW_VERSION}",
            "version": "${VERSION_NAME}",
            "build": "${BUILD_NUMBER}",
            "display": "Adminexpress v${VERSION_NAME} · build ${BUILD_NUMBER}",
            "commit": "${GITHUB_SHA}",
            "deployed_at": "${DEPLOYED_AT}"
          }
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
