name: Deploy Adminexpress Web to GitHub Pages

on:
  push:
    branches:
      - main
      - fix/admin-driver-review-simple-preview-zones-20261009
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: adminexpress-pages
  cancel-in-progress: true

env:
  PREVIEW_BUILD_DIR: ${{ github.ref_name == 'fix/admin-driver-review-simple-preview-zones-20261009' && 'preview-source/build/web' || 'build/web' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production-pinned code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name == 'fix/admin-driver-review-simple-preview-zones-20261009' && 'main' || github.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        if: github.ref_name != 'fix/admin-driver-review-simple-preview-zones-20261009'
        run: flutter pub get

      - name: Analyze production-critical admin modules
        if: github.ref_name != 'fix/admin-driver-review-simple-preview-zones-20261009'
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/admin_panel.dart \
            lib/admin_single_app_release.dart \
            lib/admin_environment_reports.dart \
            lib/admin_environment_audit.dart \
            lib/admin_control_sections.dart \
            lib/admin_dynamic_pricing.dart \
            lib/admin_environment_store.dart

      - name: Build Flutter Web
        if: github.ref_name != 'fix/admin-driver-review-simple-preview-zones-20261009'
        run: flutter build web --release --base-href / --dart-define=ADMIN_ENV=production

      - name: Bust Flutter web cache
        if: github.ref_name != 'fix/admin-driver-review-simple-preview-zones-20261009'
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          sed -i "s#flutter_bootstrap.js#flutter_bootstrap.js?v=${SOURCE_SHA}#g" build/web/index.html
          if [ -f build/web/flutter_bootstrap.js ]; then
            sed -i "s#main.dart.js#main.dart.js?v=${SOURCE_SHA}#g" build/web/flutter_bootstrap.js
          fi

      - name: Write deployed version marker
        if: github.ref_name != 'fix/admin-driver-review-simple-preview-zones-20261009'
        shell: bash
        run: |
          RAW_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          VERSION_NAME="${RAW_VERSION%%+*}"
          BUILD_NUMBER="${RAW_VERSION##*+}"
          DEPLOYED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          cat > build/web/version.json <<EOF
          {
            "package": "${RAW_VERSION}",
            "version": "${VERSION_NAME}",
            "build": "${BUILD_NUMBER}",
            "display": "Adminexpress v${VERSION_NAME} · build ${BUILD_NUMBER}",
            "commit": "$(git rev-parse HEAD)",
            "deployed_at": "${DEPLOYED_AT}"
          }
          EOF

      # GitHub Pages serves both builds from the SAME source commit but
      # different Supabase projects and different URLs.
      - name: Preserve production site
        if: github.ref_name != 'fix/admin-driver-review-simple-preview-zones-20261009'
        run: |
          mkdir -p build/site
          cp -a build/web/. build/site/

      # A staged Preview must not rebuild or modify ANY Production asset.
      # Restore the last proven Production Pages artifact byte-for-byte,
      # then replace only its preview/ subtree with this branch's build.
      - name: Download known-good published Production bundle
        if: github.ref_name == 'fix/admin-driver-review-simple-preview-zones-20261009'
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 37890547971
          github-token: ${{ github.token }}
          path: /tmp/express-live-pages-bundle

      - name: Preserve byte-identical Production and verify live website
        if: github.ref_name == 'fix/admin-driver-review-simple-preview-zones-20261009'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/site
          test -f /tmp/express-live-pages-bundle/artifact.tar
          tar -xf /tmp/express-live-pages-bundle/artifact.tar -C build/site
          test -f build/site/main.dart.js
          test -f build/site/preview/index.html
          BASE="https://admin.expressviajes.online"
          for FILE in main.dart.js flutter_bootstrap.js index.html version.json; do
            curl --fail --location --silent --show-error --retry 3 --max-time 100 "$BASE/$FILE" -o "/tmp/express-live-$FILE"
            cmp "/tmp/express-live-$FILE" "build/site/$FILE" || {
              echo "ERROR: archived production $FILE differs from published website. QA deploy aborted."
              exit 1
            }
          done
          echo "PASS: Production assets byte-identical to published GitHub Pages."

      - name: Checkout Preview QA source from unmerged branch
        if: github.ref_name == 'fix/admin-driver-review-simple-preview-zones-20261009'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: preview-source

      - name: Install Preview QA dependencies
        if: github.ref_name == 'fix/admin-driver-review-simple-preview-zones-20261009'
        working-directory: preview-source
        run: flutter pub get

      - name: Build independent Admin Preview
        working-directory: ${{ github.ref_name == 'fix/admin-driver-review-simple-preview-zones-20261009' && 'preview-source' || '.' }}
        run: flutter build web --release --base-href /preview/ --dart-define=ADMIN_ENV=preview

      - name: Bust Preview web cache
        shell: bash
        run: |
          sed -i "s#flutter_bootstrap.js#flutter_bootstrap.js?v=${GITHUB_SHA}#g" "$PREVIEW_BUILD_DIR/index.html"
          if [ -f "$PREVIEW_BUILD_DIR/flutter_bootstrap.js" ]; then
            sed -i "s#main.dart.js#main.dart.js?v=${GITHUB_SHA}#g" "$PREVIEW_BUILD_DIR/flutter_bootstrap.js"
          fi

      - name: Install Preview as separate site
        shell: bash
        run: |
          mkdir -p build/site/preview
          if [ "$GITHUB_REF_NAME" = "fix/admin-driver-review-simple-preview-zones-20261009" ]; then
            rm -rf build/site/preview
            mkdir -p build/site/preview
          fi
          cp -a "$PREVIEW_BUILD_DIR/." build/site/preview/
          cp build/site/version.json build/site/preview/version.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name, label, project in [
              ('build/site/version.json', 'production', 'zgpijrznvaskgcmauwxx'),
              ('build/site/preview/version.json', 'preview', 'xbphilqezmwfjfpdbwad'),
          ]:
              path = Path(name)
              data = json.loads(path.read_text())
              data['environment'] = label
              if label == 'preview':
                  data['commit'] = '${{ github.sha }}'
              data['supabase_project_ref'] = project
              if label == 'preview' or not Path('preview-source').exists():
                  path.write_text(json.dumps(data, indent=2))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
