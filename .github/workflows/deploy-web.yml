name: Deploy Adminexpress Web to GitHub Pages

# Control de despliegues (docs/CHANGELOG_ACTIVE.md, entrada 2026-10-11).
#
# Producción solo se publica con publish_production = true, production_source_sha igual a
# production_authorized_sha de docs/PRODUCTION_AUTHORIZED.md, preview_source_sha igual a
# preview_authorized_sha de docs/PREVIEW_AUTHORIZED.md y confirm_production = PUBLICAR PRODUCCION.
# Esa publicación reconstruye la raíz (Producción) y /preview/ desde los SHA fijados y deja un
# production-snapshot nuevo de 90 días para las siguientes publicaciones de Preview.
#
# - Ningún push ni programación dispara despliegues. Todo se lanza a mano con workflow_dispatch.
# - Preview solo se publica desde el SHA fijado en preview_authorized_sha de docs/PREVIEW_AUTHORIZED.md.
# - El job deploy solo corre si preview_only terminó con éxito.
# - Los bytes de Producción salen de un artifact production-snapshot con retención
#   de 90 días, creado con snapshot_source_run_id. El job snapshot no publica nada.

on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: 'Publish the authorized QA commit ONLY to /preview/; Production files stay byte for byte.'
        type: boolean
        required: false
        default: false
      preview_source_sha:
        description: 'Full SHA that must equal preview_authorized_sha in docs/PREVIEW_AUTHORIZED.md (preview_only=true).'
        type: string
        required: false
      production_snapshot_run_id:
        description: 'Run id of the production-snapshot artifact that preserves Production bytes (preview_only=true).'
        type: string
        required: false
      snapshot_source_run_id:
        description: 'Only copy the github-pages artifact of this Production run into a 90-day production-snapshot. Deploys nothing.'
        type: string
        required: false
      publish_production:
        description: 'Publish the authorized Production (root) and the authorized Preview (/preview/) from the pinned SHAs. Requires confirm_production.'
        type: boolean
        required: false
        default: false
      production_source_sha:
        description: 'Full SHA that must equal production_authorized_sha in docs/PRODUCTION_AUTHORIZED.md (publish_production=true).'
        type: string
        required: false
      confirm_production:
        description: 'Type PUBLICAR PRODUCCION to publish Production. Leave empty otherwise.'
        type: string
        required: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: adminexpress-pages
  cancel-in-progress: false

jobs:
  snapshot:
    if: ${{ inputs.snapshot_source_run_id != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Production Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ inputs.snapshot_source_run_id }}
          github-token: ${{ github.token }}
          path: pages-prod

      - name: Verify artifact contents
        shell: bash
        run: |
          set -euo pipefail
          test -f pages-prod/artifact.tar
          tar -tf pages-prod/artifact.tar > snapshot-list.txt
          grep -q 'index.html' snapshot-list.txt
          grep -q 'main.dart.js' snapshot-list.txt
          sha256sum pages-prod/artifact.tar | tee snapshot.sha256

      - name: Publish durable snapshot (90 days)
        id: snapshot
        uses: actions/upload-artifact@v4
        with:
          name: production-snapshot
          path: pages-prod/artifact.tar
          retention-days: 90
          if-no-files-found: error

      - name: Record snapshot in the run summary
        shell: bash
        run: |
          {
            echo "### Production snapshot"
            echo "- source run: ${{ inputs.snapshot_source_run_id }}"
            echo "- snapshot artifact id: ${{ steps.snapshot.outputs.artifact-id }}"
            echo '```'
            cat snapshot.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  preview_only:
    if: ${{ inputs.preview_only == true && inputs.snapshot_source_run_id == '' }}
    runs-on: ubuntu-latest
    outputs:
      preview_sha: ${{ steps.resolve_preview.outputs.preview_sha }}
    steps:
      - name: Resolve pinned Preview source
        id: resolve_preview
        shell: bash
        env:
          INPUT_PREVIEW_SHA: ${{ inputs.preview_source_sha }}
        run: |
          set -euo pipefail
          RESOLVED_SHA="$INPUT_PREVIEW_SHA"
          echo "PREVIEW_SHA=$RESOLVED_SHA" >> "$GITHUB_ENV"
          echo "preview_sha=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate pinned QA source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREVIEW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Full Preview SHA is required"; exit 1; }
          if [[ "$PREVIEW_SHA" = "${{ github.sha }}" ]]; then
            echo "ERROR: manual QA SHA must differ from the workflow ref."
            exit 1
          fi

      - name: Checkout workflow ref (authorization file)
        uses: actions/checkout@v5
        with:
          # Fijado a main: un dispatch desde otra rama no puede aportar su propio SHA autorizado.
          ref: main
          path: workflow-ref

      - name: Require the authorized Preview SHA (docs/PREVIEW_AUTHORIZED.md)
        shell: bash
        run: |
          set -euo pipefail
          AUTH="$(grep -E '^preview_authorized_sha: [0-9a-f]{40}$' workflow-ref/docs/PREVIEW_AUTHORIZED.md | awk '{print $2}')"
          if [[ -z "$AUTH" ]]; then
            echo "ERROR: docs/PREVIEW_AUTHORIZED.md has no preview_authorized_sha."
            exit 1
          fi
          if [[ "$PREVIEW_SHA" != "$AUTH" ]]; then
            echo "ERROR: $PREVIEW_SHA is not the authorized Preview SHA ($AUTH)."
            exit 1
          fi
          echo "PASS: $PREVIEW_SHA is the authorized Preview SHA."

      - name: Require the Production snapshot run id
        shell: bash
        env:
          SNAPSHOT_RUN_ID: ${{ inputs.production_snapshot_run_id }}
        run: |
          set -euo pipefail
          [[ "$SNAPSHOT_RUN_ID" =~ ^[0-9]+$ ]] || { echo "production_snapshot_run_id is required"; exit 1; }

      - name: Download durable Production snapshot (90-day artifact)
        uses: actions/download-artifact@v4
        with:
          name: production-snapshot
          run-id: ${{ inputs.production_snapshot_run_id }}
          github-token: ${{ github.token }}
          path: pages-prod

      - name: Restore Production bytes and verify published site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/site
          test -f pages-prod/artifact.tar
          tar -xf pages-prod/artifact.tar -C build/site
          test -s build/site/main.dart.js
          test -s build/site/flutter_bootstrap.js
          test -s build/site/index.html
          test -s build/site/version.json
          test -s build/site/preview/index.html
          BASE="https://admin.expressviajes.online"
          for FILE in index.html flutter_bootstrap.js main.dart.js version.json; do
            curl --fail --location --silent --show-error --retry 3 --max-time 90 \
              -H "Cache-Control: no-cache" "$BASE/$FILE" -o "/tmp/live-$FILE"
            cmp "/tmp/live-$FILE" "build/site/$FILE" || {
              echo "ERROR: published Production $FILE does not match archived bytes; abort Preview-only deploy."
              exit 1
            }
          done
          find build/site -type f ! -path 'build/site/preview/*' -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/exact-prod-manifest
          echo "PASS: Production site matches published artifact exactly."

      - name: Checkout pinned Preview QA code without changing main
        uses: actions/checkout@v5
        with:
          ref: ${{ env.PREVIEW_SHA }}
          path: preview-source

      - name: Validate QA commit and project isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C preview-source rev-parse HEAD)" = "$PREVIEW_SHA"
          grep -q "admin_zone_list_scoped" preview-source/lib/admin_detail_dialogs.dart
          grep -q "admin_driver_kyc_bolivia_manual_review_part" preview-source/lib/admin_bolivia_kyc.dart
          grep -q "AdminEnvironmentLinkButton" preview-source/lib/admin_panel.dart
          grep -q "const supabaseUrl = _productionUrl;" preview-source/lib/core/supabase_client.dart
          grep -q "if (adminIsPreview && !_previewScopedModules.contains(value))" preview-source/lib/admin_panel.dart
          if grep -q "xbphilqezmwfjfpdbwad" preview-source/lib/core/supabase_client.dart; then
            echo "ERROR: Preview must not connect to the separate Supabase database."
            exit 1
          fi
          echo "PASS: tested, pinned Preview source and isolated Supabase config."

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Preview dependencies
        working-directory: preview-source
        run: flutter pub get

      - name: Analyze Preview driver review
        working-directory: preview-source
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/admin_detail_dialogs.dart lib/admin_panel.dart lib/core/supabase_client.dart

      - name: Build Preview only (dedicated Supabase database)
        working-directory: preview-source
        run: flutter build web --release --base-href /preview/ --dart-define=ADMIN_ENV=preview

      - name: Replace ONLY Preview files; verify every Production byte
        shell: bash
        run: |
          set -euo pipefail
          # Marca de build visible solo en Preview (solo si el código tiene el marcador).
          if grep -Fq "__EXPRESS_PREVIEW_BUILD_SHA__" preview-source/build/web/index.html; then
            sed -i "s#__EXPRESS_PREVIEW_BUILD_SHA__#${PREVIEW_SHA}#g" preview-source/build/web/index.html
            grep -Fq "const buildSha = '${PREVIEW_SHA}'" preview-source/build/web/index.html
          fi
          sed -i "s#flutter_bootstrap.js#flutter_bootstrap.js?v=${PREVIEW_SHA}#g" preview-source/build/web/index.html
          if [ -f preview-source/build/web/flutter_bootstrap.js ]; then
            sed -i "s#main.dart.js#main.dart.js?v=${PREVIEW_SHA}#g" preview-source/build/web/flutter_bootstrap.js
          fi
          rm -rf build/site/preview
          mkdir -p build/site/preview
          cp -a preview-source/build/web/. build/site/preview/
          cp build/site/version.json build/site/preview/version.json
          python3 - <<'PY'
          import json, os, datetime
          from pathlib import Path
          path = Path('build/site/preview/version.json')
          data = json.loads(path.read_text())
          data['environment'] = 'preview'
          data['supabase_project_ref'] = 'zgpijrznvaskgcmauwxx'
          data['data_channel'] = 'preview'
          data['commit'] = os.environ['PREVIEW_SHA']
          data['deployed_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          path.write_text(json.dumps(data, indent=2))
          PY
          find build/site -type f ! -path 'build/site/preview/*' -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/after-prod-manifest
          cmp /tmp/exact-prod-manifest /tmp/after-prod-manifest
          echo "PASS: Only /preview/ changed; Production files are byte-identical."

      - name: Upload isolated Preview Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  publish_production:
    if: ${{ inputs.publish_production == true && inputs.preview_only != true && inputs.snapshot_source_run_id == '' && inputs.confirm_production == 'PUBLICAR PRODUCCION' }}
    runs-on: ubuntu-latest
    outputs:
      production_sha: ${{ steps.resolve.outputs.production_sha }}
      preview_sha: ${{ steps.resolve.outputs.preview_sha }}
    steps:
      - name: Resolve and validate pinned SHAs
        id: resolve
        shell: bash
        env:
          INPUT_PRODUCTION_SHA: ${{ inputs.production_source_sha }}
          INPUT_PREVIEW_SHA: ${{ inputs.preview_source_sha }}
        run: |
          set -euo pipefail
          [[ "$INPUT_PRODUCTION_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "production_source_sha must be a full 40-hex SHA"; exit 1; }
          [[ "$INPUT_PREVIEW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "preview_source_sha must be a full 40-hex SHA"; exit 1; }
          echo "PRODUCTION_SHA=$INPUT_PRODUCTION_SHA" >> "$GITHUB_ENV"
          echo "PREVIEW_SHA=$INPUT_PREVIEW_SHA" >> "$GITHUB_ENV"
          echo "production_sha=$INPUT_PRODUCTION_SHA" >> "$GITHUB_OUTPUT"
          echo "preview_sha=$INPUT_PREVIEW_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout workflow ref (authorization files)
        uses: actions/checkout@v5
        with:
          # Fijado a main: un dispatch desde otra rama no puede aportar sus propias SHA autorizadas.
          ref: main
          path: workflow-ref

      - name: Require the authorized Production and Preview SHAs
        shell: bash
        run: |
          set -euo pipefail
          PAUTH="$(grep -E '^production_authorized_sha: [0-9a-f]{40}$' workflow-ref/docs/PRODUCTION_AUTHORIZED.md | awk '{print $2}')"
          VAUTH="$(grep -E '^preview_authorized_sha: [0-9a-f]{40}$' workflow-ref/docs/PREVIEW_AUTHORIZED.md | awk '{print $2}')"
          if [[ -z "$PAUTH" || "$PRODUCTION_SHA" != "$PAUTH" ]]; then
            echo "ERROR: $PRODUCTION_SHA is not the authorized Production SHA ($PAUTH)."
            exit 1
          fi
          if [[ -z "$VAUTH" || "$PREVIEW_SHA" != "$VAUTH" ]]; then
            echo "ERROR: $PREVIEW_SHA is not the authorized Preview SHA ($VAUTH)."
            exit 1
          fi
          echo "PASS: Production and Preview SHAs are the authorized ones."

      - name: Checkout Production source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.PRODUCTION_SHA }}
          path: production-source

      - name: Checkout Preview source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.PREVIEW_SHA }}
          path: preview-source

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Production root (ADMIN_ENV=production)
        shell: bash
        working-directory: production-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCTION_SHA"
          flutter pub get
          flutter build web --release --base-href / --dart-define=ADMIN_ENV=production

      - name: Build Preview (ADMIN_ENV=preview, pinned QA source)
        shell: bash
        working-directory: preview-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PREVIEW_SHA"
          grep -q "if (adminIsPreview && !_previewScopedModules.contains(value))" lib/admin_panel.dart
          grep -q "const supabaseUrl = _productionUrl;" lib/core/supabase_client.dart
          if grep -q "xbphilqezmwfjfpdbwad" lib/core/supabase_client.dart; then
            echo "ERROR: Preview must not connect to the separate Supabase database."
            exit 1
          fi
          flutter pub get
          flutter build web --release --base-href /preview/ --dart-define=ADMIN_ENV=preview

      - name: Assemble the full site and stamp version files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/site
          mkdir -p build/site/preview
          cp -a production-source/build/web/. build/site/
          cp -a preview-source/build/web/. build/site/preview/
          if grep -Fq "__EXPRESS_PREVIEW_BUILD_SHA__" build/site/preview/index.html; then
            sed -i "s#__EXPRESS_PREVIEW_BUILD_SHA__#${PREVIEW_SHA}#g" build/site/preview/index.html
            grep -Fq "const buildSha = '${PREVIEW_SHA}'" build/site/preview/index.html
          fi
          sed -i "s#flutter_bootstrap.js#flutter_bootstrap.js?v=${PREVIEW_SHA}#g" build/site/preview/index.html
          if [ -f build/site/preview/flutter_bootstrap.js ]; then
            sed -i "s#main.dart.js#main.dart.js?v=${PREVIEW_SHA}#g" build/site/preview/flutter_bootstrap.js
          fi
          python3 - <<'PY'
          import json, os, datetime
          from pathlib import Path
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          common = {'supabase_project_ref': 'zgpijrznvaskgcmauwxx', 'deployed_at': now}
          Path('build/site/version.json').write_text(json.dumps({**common, 'environment': 'production', 'data_channel': 'production', 'commit': os.environ['PRODUCTION_SHA']}, indent=2))
          Path('build/site/preview/version.json').write_text(json.dumps({**common, 'environment': 'preview', 'data_channel': 'preview', 'commit': os.environ['PREVIEW_SHA']}, indent=2))
          PY
          test -s build/site/index.html
          test -s build/site/main.dart.js
          test -s build/site/preview/index.html
          test -s build/site/preview/main.dart.js
          echo "PASS: full site assembled (Production root and /preview/)."

      - name: Create durable Production snapshot (90 days)
        shell: bash
        run: |
          set -euo pipefail
          tar -C build/site -cf artifact.tar .
          tar -tf artifact.tar > snapshot-list.txt
          grep -q 'index.html' snapshot-list.txt
          grep -q 'main.dart.js' snapshot-list.txt
          sha256sum artifact.tar | tee snapshot.sha256

      - name: Publish durable snapshot (90 days)
        id: snapshot_upload
        uses: actions/upload-artifact@v4
        with:
          name: production-snapshot
          path: artifact.tar
          retention-days: 90
          if-no-files-found: error

      - name: Upload full Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

      - name: Record publish in the run summary
        shell: bash
        run: |
          {
            echo "### Publicación de Producción y Preview"
            echo "- Producción (raíz): ${PRODUCTION_SHA}"
            echo "- Preview (/preview/): ${PREVIEW_SHA}"
            echo "- Snapshot de 90 días: ${{ steps.snapshot_upload.outputs.artifact-id }}"
            echo '```'
            cat snapshot.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_production:
    if: ${{ needs.publish_production.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [publish_production]
    steps:
      - name: Deploy full site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Production and Preview SHAs
        shell: bash
        env:
          EXPECTED_PRODUCTION_SHA: ${{ needs.publish_production.outputs.production_sha }}
          EXPECTED_PREVIEW_SHA: ${{ needs.publish_production.outputs.preview_sha }}
        run: |
          set -euo pipefail
          BASE="https://admin.expressviajes.online"
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 20 -H "Cache-Control: no-cache" "$BASE/version.json?check=$EXPECTED_PRODUCTION_SHA" -o /tmp/production-marker.json \
              && curl -fsSL --max-time 20 -H "Cache-Control: no-cache" "$BASE/preview/version.json?check=$EXPECTED_PREVIEW_SHA" -o /tmp/preview-marker.json \
              && python3 - <<'PY'
          import json, os
          from pathlib import Path
          production = json.loads(Path('/tmp/production-marker.json').read_text())
          preview = json.loads(Path('/tmp/preview-marker.json').read_text())
          assert production.get('commit') == os.environ['EXPECTED_PRODUCTION_SHA'], 'Production SHA not live yet'
          assert production.get('environment') == 'production', 'Production channel unexpected'
          assert preview.get('commit') == os.environ['EXPECTED_PREVIEW_SHA'], 'Preview SHA not live yet'
          assert preview.get('environment') == 'preview', 'Preview channel unexpected'
          print('PASS: Production and Preview SHAs are live')
          PY
            then
              exit 0
            fi
            echo "Public Pages version not confirmed on attempt $attempt of 12."
            sleep 10
          done
          echo "::error::Published versions could not be verified. Review GitHub Pages immediately."
          exit 1

  deploy:
    if: ${{ needs.preview_only.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [preview_only]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Preview SHA and unchanged Production marker
        if: ${{ needs.preview_only.result == 'success' }}
        shell: bash
        env:
          EXPECTED_PREVIEW_SHA: ${{ needs.preview_only.outputs.preview_sha }}
          EXPECTED_PRODUCTION_SHA: 30e60582a337be3911671742d780b240793497df
        run: |
          set -euo pipefail
          BASE="https://admin.expressviajes.online"
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 20 -H "Cache-Control: no-cache" "$BASE/version.json?check=$EXPECTED_PREVIEW_SHA" -o /tmp/production-marker.json \
              && curl -fsSL --max-time 20 -H "Cache-Control: no-cache" "$BASE/preview/version.json?check=$EXPECTED_PREVIEW_SHA" -o /tmp/preview-marker.json \
              && python3 - <<'PY'
          import json, os
          from pathlib import Path
          production = json.loads(Path('/tmp/production-marker.json').read_text())
          preview = json.loads(Path('/tmp/preview-marker.json').read_text())
          assert production.get('commit') == os.environ['EXPECTED_PRODUCTION_SHA'], 'Production SHA unexpectedly changed'
          assert production.get('environment') == 'production', 'Production channel unexpectedly changed'
          assert preview.get('commit') == os.environ['EXPECTED_PREVIEW_SHA'], 'New Preview SHA not yet published'
          assert preview.get('environment') == 'preview', 'Preview channel unexpectedly changed'
          assert preview.get('supabase_project_ref') == 'zgpijrznvaskgcmauwxx', 'Preview project unexpectedly changed'
          print('PASS: expected Preview SHA is live; Production SHA and channel unchanged')
          PY
            then
              exit 0
            fi
            echo "Public Pages version not confirmed on attempt $attempt of 12."
            sleep 10
          done
          echo "::error::Published version could not be verified. Review GitHub Pages immediately."
          exit 1
