name: Preview Recovery Once

on:
  push:
    branches:
      - chatgpt/admin-preview-independent-20261010

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: adminexpress-pages
  cancel-in-progress: false

jobs:
  build_preview:
    if: ${{ contains(github.event.head_commit.message, '[preview-recovery-once]') }}
    runs-on: ubuntu-latest
    outputs:
      production_sha: ${{ steps.live_prod.outputs.production_sha }}
    steps:
      - name: Checkout QA source
        uses: actions/checkout@v5

      - name: Require authorized QA SHA
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          AUTH="$(git show origin/main:docs/PREVIEW_AUTHORIZED.md | grep -E '^preview_authorized_sha: [0-9a-f]{40}$' | awk '{print $2}')"
          test "$AUTH" = "$GITHUB_SHA" || { echo "Unauthorized QA SHA: $GITHUB_SHA (expected $AUTH)"; exit 1; }

      - name: Guard Preview navigation and release protection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/admin_panel.dart').read_text()
          for i in range(29):
              assert f'case {i}:' in p, f'module {i} missing'
          assert '_previewScopedModules' not in p
          assert 'productionAccess: allowProduction && !adminIsPreview' in p
          assert "const supabaseUrl = _productionUrl;" in Path('lib/core/supabase_client.dart').read_text()
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Preview critical files
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos             lib/admin_panel.dart             lib/admin_detail_dialogs.dart             lib/admin_control_sections.dart             lib/admin_driver_subscriptions.dart             lib/core/supabase_client.dart

      - name: Build Preview
        run: flutter build web --release --base-href /preview/ --dart-define=ADMIN_ENV=preview

      - name: Download current Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 38169045774
          github-token: ${{ github.token }}
          path: pages-current

      - name: Restore current site and verify Production bytes
        id: live_prod
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/site
          test -f pages-current/artifact.tar
          tar -xf pages-current/artifact.tar -C build/site
          test -s build/site/index.html
          test -s build/site/main.dart.js
          test -s build/site/version.json
          BASE="https://admin.expressviajes.online"
          for FILE in index.html flutter_bootstrap.js main.dart.js version.json; do
            curl --fail --location --silent --show-error --retry 3 --max-time 90               -H "Cache-Control: no-cache" "$BASE/$FILE" -o "/tmp/live-$FILE"
            cmp "/tmp/live-$FILE" "build/site/$FILE"
          done
          PROD_SHA="$(python3 -c "import json; print(json.load(open('build/site/version.json'))['commit'])")"
          [[ "$PROD_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "production_sha=$PROD_SHA" >> "$GITHUB_OUTPUT"
          find build/site -type f ! -path 'build/site/preview/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/prod-before

      - name: Replace Preview only
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s#flutter_bootstrap.js#flutter_bootstrap.js?v=$GITHUB_SHA#g" build/web/index.html
          if [ -f build/web/flutter_bootstrap.js ]; then
            sed -i "s#main.dart.js#main.dart.js?v=$GITHUB_SHA#g" build/web/flutter_bootstrap.js
          fi
          rm -rf build/site/preview
          mkdir -p build/site/preview
          cp -a build/web/. build/site/preview/
          cp build/site/version.json build/site/preview/version.json
          python3 - <<'PY'
          import json, os, datetime
          from pathlib import Path
          p=Path('build/site/preview/version.json')
          d=json.loads(p.read_text())
          d['environment']='preview'
          d['data_channel']='preview'
          d['supabase_project_ref']='zgpijrznvaskgcmauwxx'
          d['commit']=os.environ['GITHUB_SHA']
          d['deployed_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          p.write_text(json.dumps(d,indent=2))
          PY
          find build/site -type f ! -path 'build/site/preview/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/prod-after
          cmp /tmp/prod-before /tmp/prod-after

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy_preview:
    if: ${{ needs.build_preview.result == 'success' }}
    needs: build_preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Verify live Production unchanged and Preview updated
        shell: bash
        env:
          EXPECTED_PROD: ${{ needs.build_preview.outputs.production_sha }}
        run: |
          set -euo pipefail
          BASE="https://admin.expressviajes.online"
          curl --fail --location --silent --show-error --retry 5 --max-time 90 -H "Cache-Control: no-cache" "$BASE/version.json" -o /tmp/prod.json
          curl --fail --location --silent --show-error --retry 5 --max-time 90 -H "Cache-Control: no-cache" "$BASE/preview/version.json" -o /tmp/preview.json
          python3 - <<'PY'
          import json, os
          prod=json.load(open('/tmp/prod.json'))
          prev=json.load(open('/tmp/preview.json'))
          assert prod['commit']==os.environ['EXPECTED_PROD'], (prod, os.environ['EXPECTED_PROD'])
          assert prev['commit']==os.environ['GITHUB_SHA'], (prev, os.environ['GITHUB_SHA'])
          assert prev.get('environment')=='preview'
          assert prev.get('data_channel')=='preview'
          print('PASS: Preview updated; Production marker unchanged.')
          PY
